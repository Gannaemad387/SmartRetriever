# .streamlit/config.toml
# ⚙️ إعدادات تطبيق Streamlit

# ============================================================
# 🎨 إعدادات المظهر (Theme) - Barbie Color Palette 💖
# ============================================================
[theme]
# الألوان الأساسية
primaryColor = "#E0218A"              # اللون الأساسي (Hot Barbie Pink) - للأزرار والعناصر التفاعلية
backgroundColor = "#FCE4EC"           # لون الخلفية (Soft Pastel Pink)
secondaryBackgroundColor = "#FFFFFF"  # لون الخلفية الثانوي (Pure White) - للبطاقات والسايدبار
textColor = "#4A0E2E"                 # لون النص (Deep Burgundy)
# ✅ إعدادات الخطوط
font = "sans serif"                   # نوع الخط

# ملحوظة: قسم [theme.custom] اتشال من هنا لإنه مش قسم معترف بيه في
# إعدادات Streamlit الرسمية (المفاتيح المدعومة تحت [theme] هي بس
# primaryColor, backgroundColor, secondaryBackgroundColor, textColor, font).
# التحكم الفعلي في ألوان العناوين والروابط بيتم عن طريق styles/custom.css
# و components/sidebar.py.

# ============================================================
# 🧭 إعدادات الواجهة (Client)
# ============================================================
[client]
# إيقاف قائمة التنقل التلقائية بتاعة Streamlit لصفحات pages/
# عشان نستخدم بس القائمة المخصصة في components/sidebar.py
# (بدون ده كانت القائمتين بتظهروا مع بعض فوق وتحت في الـ Sidebar)
showSidebarNavigation = false

# ============================================================
# 🖥️ إعدادات الخادم (Server)
# ============================================================
[server]
# حجم الملفات المرفوعة (بالـ MB)
maxUploadSize = 20
# السماح بـ CORS
enableCORS = true
# حماية من هجمات CSRF
enableXsrfProtection = true

# ============================================================
# 🌐 إعدادات المتصفح (Browser)
# ============================================================
[browser]
# إيقاف جمع إحصائيات الاستخدام
gatherUsageStats = false

# ============================================================
# 🏃 إعدادات التشغيل (Runner)
# ============================================================
[runner]
# تمكين الـ Magic Commands (مثل st.write)
magicEnabled = true

# ============================================================
# 📝 إعدادات التسجيل (Logger)
# ============================================================
[logger]
# مستوى التسجيل: error, warning, info, debug
level = "info"

# ============================================================
# 🌍 إعدادات عامة (Global)
# ============================================================
[global]
# وضع التطوير (true/false)
developmentMode = false

# ============================================================
# 📊 إعدادات عرض البيانات (DataFrame)
# ============================================================
[dataFrame]
# عدد الصفوف المعروضة افتراضياً
defaultRows = 10

# ============================================================
# 🔧 إعدادات متقدمة
# ============================================================
# الحد الأقصى لحجم الرسالة (بالـ MB)
# maxMessageSize = 200
# مهلة الاتصال (بالثواني)
# server.maxMessageSize = 200
